# Database Configuration
# PostgreSQL JDBC driver class name
spring.datasource.driver-class-name=org.postgresql.Driver
# Database URL from environment variable
spring.datasource.url=${POSTGRES_URL}
# Database username from environment variable
spring.datasource.username=${POSTGRES_USER}
# Database password from environment variable
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA/Hibernate Configuration
# Specify the database dialect for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Automatically update database schema based on entity classes
spring.jpa.hibernate.ddl-auto=update
# Enable SQL query logging
spring.jpa.show-sql=true

# JWT Configuration
# JWT secret key from environment variable
jwt.secret=${JWT_SECRET}
# JWT token expiration time in milliseconds (1 hour)
jwt.expiration=3600000

# Server Configuration
# Port number from environment variable, default to 8080 if not set
server.port=${PORT:8080}

# Thymeleaf Configuration
# Disable template location checking
spring.thymeleaf.check-template-location=false