<!-- Main dashboard page for authenticated users -->
<!DOCTYPE html>
<html>
<head>
    <!-- Page title displayed in browser tab -->
    <title>Dashboard</title>
    <!-- Link to external CSS file for styling -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main container for content -->
    <div class="container">
        <!-- Header section with welcome message and logout button -->
        <div class="header">
            <h1>Welcome to Dashboard</h1>
            <!-- Logout button with click handler -->
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <!-- Create Bank Section -->
        <section class="section">
            <!-- Section title -->
            <h2>Create Bank</h2>
            <!-- Form for creating new question banks -->
            <form id="bankForm">
                <!-- Bank title input field -->
                <input type="text" id="bankTitle" placeholder="Bank Title" required>
                <!-- Bank description textarea -->
                <textarea id="bankDescription" placeholder="Bank Description"></textarea>
                <!-- Submit button for creating bank -->
                <button type="submit">Create Bank</button>
            </form>
        </section>

        <!-- My Question Banks Section -->
        <section class="section">
            <!-- Section title -->
            <h2>My Question Banks</h2>
            <!-- Container for displaying user's question banks -->
            <div id="banksList" class="banks-grid"></div>
        </section>

        <!-- My Quizzes Section -->
        <section class="section">
            <!-- Section title -->
            <h2>My Quizzes</h2>
            <!-- Container for displaying user's quizzes -->
            <div id="quizList" class="quiz-list"></div>
        </section>

        <!-- Public Question Banks Section -->
        <section class="section">
            <!-- Section title -->
            <h2>Public Question Banks</h2>
            <!-- Container for displaying public question banks -->
            <div id="publicBanksList" class="banks-grid"></div>
        </section>

        <!-- Commented out Topics Overview section for future implementation -->
        <!-- <section class="section">
            <h2>Topics Overview</h2>
            <div id="topicsList" class="banks-grid"></div>
        </section> -->

    </div>
    <!-- Link to JavaScript file for dashboard functionality -->
    <script src="dashboard.js"></script>
</body>
</html>
