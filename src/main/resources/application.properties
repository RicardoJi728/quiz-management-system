# Database Configuration
# URL for connecting to PostgreSQL database
spring.datasource.url=jdbc:postgresql://localhost:5432/appdb
# Database username for authentication
spring.datasource.username=appuser
# Database password for authentication
spring.datasource.password=app
# PostgreSQL JDBC driver class name
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
# Automatically update database schema based on entity classes
spring.jpa.hibernate.ddl-auto=update
# Enable SQL query logging
spring.jpa.show-sql=true
# Specify the database dialect for PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration (512-bit key)
# Secret key for JWT token generation and validation
app.jwtSecret=645367566B59703373367639792F423F4528482B4D6251655468576D5A71347437566E597033733676397924423F4528482B4D6251655468576D5A713474375666
# JWT token expiration time in milliseconds (24 hours)
app.jwtExpirationMs=86400000

# Server Configuration
# Port number on which the application will run
server.port=8080

# Static resources configuration
# Location of static resources (CSS, JS, images)
spring.web.resources.static-locations=classpath:/static/
# URL pattern for static resources
spring.mvc.static-path-pattern=/**

# SQL logging configuration
# Format SQL queries for better readability in logs
spring.jpa.properties.hibernate.format_sql=true
# Show SQL queries in logs
spring.jpa.properties.hibernate.show_sql=true

# Thymeleaf Configuration
# Disable template location checking
spring.thymeleaf.check-template-location=false
